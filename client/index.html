<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Money Mitra: track, learn and ask about money</title>
    <meta name="description" content="Track where your money goes, learn terms like SIP and CIBIL in plain English, and ask money questions anonymously. Free and built for India." />
    <meta name="theme-color" content="#0f1b2d" />
    <script>
      // Apply the saved theme (or the device setting) before the page draws, to avoid a white flash
      (function () {
        var choice = "system";
        try { choice = localStorage.getItem("money-mitra:theme") || "system"; } catch (e) {}
        var dark = choice === "dark" || (choice === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
    <meta name="apple-mobile-web-app-title" content="Money Mitra" />
    <meta property="og:title" content="Money Mitra: your friend for money" />
    <meta property="og:description" content="Track your money, learn finance in plain English, and ask anything without judgment." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://money-mitra-three.vercel.app/" />
    <meta property="og:image" content="https://money-mitra-three.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
